<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام النجوم المدرسي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary:#1a3c5e; --accent:#f0a500; --bg:#f4f7fb; --card:#fff; --text:#1a2b3c; --muted:#7a8fa6; --border:#d8e4f0; --danger:#e74c3c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Tajawal',sans-serif; background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .container { width:100%; max-width:460px; padding:24px; }
  .header { text-align:center; margin-bottom:32px; }
  .logo { width:72px; height:72px; background:var(--primary); border-radius:20px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; box-shadow:0 8px 24px rgba(26,60,94,0.25); font-size:36px; }
  .header h1 { font-size:22px; font-weight:800; color:var(--primary); margin-bottom:4px; }
  .header p  { font-size:14px; color:var(--muted); }
  .card { background:var(--card); border-radius:24px; padding:32px; box-shadow:0 4px 32px rgba(26,60,94,0.08); }
  .role-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:28px; background:var(--bg); padding:6px; border-radius:14px; }
  .role-tab { padding:10px 8px; border:none; background:transparent; border-radius:10px; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:13px; font-weight:600; color:var(--muted); transition:all 0.25s; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .role-tab .icon { font-size:20px; }
  .role-tab.active { background:var(--card); color:var(--primary); box-shadow:0 2px 12px rgba(26,60,94,0.1); }
  .form-section { display:none; }
  .form-section.active { display:block; }
  .form-title { font-size:17px; font-weight:700; color:var(--text); margin-bottom:20px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px; }
  .field input { width:100%; padding:13px 16px; border:2px solid var(--border); border-radius:12px; font-family:'Tajawal',sans-serif; font-size:15px; color:var(--text); background:var(--bg); transition:all 0.2s; direction:ltr; text-align:right; outline:none; }
  .field input:focus { border-color:var(--primary); background:#fff; }
  .code-input-wrapper { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .code-box { width:100%; aspect-ratio:1; border:2px solid var(--border); border-radius:12px; background:var(--bg); font-family:'Tajawal',sans-serif; font-size:24px; font-weight:800; color:var(--primary); text-align:center; text-transform:uppercase; outline:none; transition:all 0.2s; }
  .code-box:focus { border-color:var(--accent); background:#fff; }
  .btn-login { width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:12px; font-family:'Tajawal',sans-serif; font-size:16px; font-weight:700; cursor:pointer; margin-top:8px; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-login:hover { background:#0f2a45; }
  .btn-login:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }
  .error-msg { background:#fdf0ef; color:var(--danger); border:1px solid #f5c6c2; border-radius:10px; padding:10px 14px; font-size:13px; font-weight:500; margin-bottom:16px; display:none; align-items:center; gap:8px; }
  .error-msg.show { display:flex; }
  .footer { text-align:center; margin-top:20px; font-size:12px; color:var(--muted); }
  .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
  .btn-login.loading .spinner { display:block; }
  .btn-login.loading .btn-text { display:none; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">⭐</div>
    <h1>نظام النجوم المدرسي</h1>
    <p>نحفّز الطلاب ونكافئ التميز</p>
  </div>
  <div class="card">
    <div class="role-tabs">
      <button class="role-tab active" onclick="switchRole('teacher')"><span class="icon">👨‍🏫</span><span>معلم</span></button>
      <button class="role-tab" onclick="switchRole('student')"><span class="icon">🎓</span><span>طالب</span></button>
      <button class="role-tab" onclick="switchRole('admin')"><span class="icon">🏫</span><span>إدارة</span></button>
    </div>
    <div class="error-msg" id="errorMsg"><span>⚠️</span><span id="errorText"></span></div>

    <div class="form-section active" id="teacherForm">
      <div class="form-title">دخول المعلم</div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="teacherEmail" placeholder="teacher@school.com"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="teacherPass" placeholder="••••••••"></div>
      <button class="btn-login" id="teacherBtn" onclick="loginStaff('teacher')"><div class="spinner"></div><span class="btn-text">دخول</span></button>
    </div>

    <div class="form-section" id="studentForm">
      <div class="form-title">أدخل كودك الخاص</div>
      <div class="field">
        <div class="code-input-wrapper">
          <input class="code-box" maxlength="1" id="c1" oninput="moveNext(this,'c2')" onkeydown="movePrev(event,this,'')">
          <input class="code-box" maxlength="1" id="c2" oninput="moveNext(this,'c3')" onkeydown="movePrev(event,this,'c1')">
          <input class="code-box" maxlength="1" id="c3" oninput="moveNext(this,'c4')" onkeydown="movePrev(event,this,'c2')">
          <input class="code-box" maxlength="1" id="c4" oninput="moveNext(this,'')"  onkeydown="movePrev(event,this,'c3')">
        </div>
      </div>
      <button class="btn-login" id="studentBtn" onclick="loginStudent()"><div class="spinner"></div><span class="btn-text">عرض نقاطي ⭐</span></button>
    </div>

    <div class="form-section" id="adminForm">
      <div class="form-title">دخول الإدارة</div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="adminEmail" placeholder="admin@school.com"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="adminPass" placeholder="••••••••"></div>
      <button class="btn-login" id="adminBtn" onclick="loginStaff('admin')"><div class="spinner"></div><span class="btn-text">دخول لوحة الإدارة</span></button>
    </div>
  </div>
  <div class="footer">جميع الحقوق محفوظة © نظام النجوم المدرسي</div>
</div>

<script type="module">
import { initializeApp }           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app  = initializeApp({ apiKey:"AIzaSyBvOLYvQ7QH4VOOidQ165F2Ao6_9fBi4g8", authDomain:"anas-96718.firebaseapp.com", projectId:"anas-96718", storageBucket:"anas-96718.firebasestorage.app", messagingSenderId:"459362938160", appId:"1:459362938160:web:5cc9c88bedfc3e95d06cf5" });
const auth = getAuth(app);
const db   = getFirestore(app);

window.switchRole = role => {
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.role-tab')[{teacher:0,student:1,admin:2}[role]].classList.add('active');
  document.getElementById(role+'Form').classList.add('active');
  hideError();
};

window.moveNext = (el,nextId) => { el.value=el.value.toUpperCase(); if(el.value&&nextId) document.getElementById(nextId).focus(); };
window.movePrev = (e,el,prevId) => { if(e.key==='Backspace'&&!el.value&&prevId) document.getElementById(prevId).focus(); };

window.loginStaff = async role => {
  hideError();
  const email = document.getElementById(role==='teacher'?'teacherEmail':'adminEmail').value.trim();
  const pass  = document.getElementById(role==='teacher'?'teacherPass':'adminPass').value;
  if (!email||!pass) { showError('يرجى إدخال البريد وكلمة المرور'); return; }
  const btnId = role==='teacher'?'teacherBtn':'adminBtn';
  setLoading(btnId, true);
  try {
    const cred    = await signInWithEmailAndPassword(auth, email, pass);
    const userDoc = await getDoc(doc(db,'users',cred.user.uid));
    if (!userDoc.exists()) { showError('الحساب غير موجود في النظام'); return; }
    const userData = userDoc.data();
    sessionStorage.setItem('user', JSON.stringify({uid:cred.user.uid,...userData}));
    window.location.href = userData.role==='admin' ? 'admin.html' : 'teacher.html';
  } catch(e) {
    const msgs = {'auth/user-not-found':'البريد غير موجود','auth/wrong-password':'كلمة المرور غير صحيحة','auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/too-many-requests':'تجاوزت عدد المحاولات'};
    showError(msgs[e.code]||'حدث خطأ، حاول مجدداً');
  } finally { setLoading(btnId,false); }
};

window.loginStudent = async () => {
  hideError();
  const code = ['c1','c2','c3','c4'].map(id=>document.getElementById(id).value.toUpperCase()).join('');
  if (code.length<4) { showError('أدخل الكود المكون من 4 أحرف كاملاً'); return; }
  setLoading('studentBtn',true);
  try {
    const snap = await getDocs(query(collection(db,'students'),where('code','==',code)));
    if (snap.empty) { showError('هذا الكود غير موجود، تحقق منه وحاول مجدداً'); return; }
    sessionStorage.setItem('student', JSON.stringify({id:snap.docs[0].id,...snap.docs[0].data()}));
    window.location.href = 'student.html';
  } catch(e) { showError('حدث خطأ، حاول مجدداً'); }
  finally { setLoading('studentBtn',false); }
};

const showError = msg => { document.getElementById('errorText').textContent=msg; document.getElementById('errorMsg').classList.add('show'); };
const hideError = ()  => document.getElementById('errorMsg').classList.remove('show');
const setLoading = (id,state) => { document.getElementById(id).classList.toggle('loading',state); document.getElementById(id).disabled=state; };
</script>
</body>
</html>
