<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلم - نظام النجوم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary:#1a3c5e; --accent:#f0a500; --bg:#f4f7fb; --card:#fff; --text:#1a2b3c; --muted:#7a8fa6; --border:#d8e4f0; --success:#2ecc71; --danger:#e74c3c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Tajawal',sans-serif; background:var(--bg); min-height:100vh; color:var(--text); }

  .topbar { background:var(--primary); padding:0 24px; height:60px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 16px rgba(26,60,94,0.2); }
  .topbar-brand { display:flex; align-items:center; gap:10px; color:white; }
  .topbar-brand .icon { width:34px; height:34px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .topbar-brand span { font-size:15px; font-weight:700; }
  .topbar-user { display:flex; align-items:center; gap:10px; color:rgba(255,255,255,0.85); font-size:14px; }
  .btn-logout { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:6px 14px; border-radius:8px; font-family:'Tajawal',sans-serif; font-size:13px; cursor:pointer; transition:all 0.2s; }
  .btn-logout:hover { background:rgba(255,255,255,0.2); }

  .content { max-width:780px; margin:0 auto; padding:24px 16px; }
  .section-title { font-size:13px; font-weight:700; color:var(--muted); margin-bottom:10px; }

  .classes-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
  .class-btn { padding:14px 10px; border:2px solid var(--border); border-radius:14px; background:var(--card); cursor:pointer; font-family:'Tajawal',sans-serif; font-size:14px; font-weight:700; color:var(--muted); transition:all 0.2s; text-align:center; }
  .class-btn .grade { font-size:11px; font-weight:500; opacity:0.7; margin-bottom:2px; }
  .class-btn .section { font-size:20px; font-weight:800; color:var(--primary); opacity:0.4; }
  .class-btn:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 4px 16px rgba(26,60,94,0.1); }
  .class-btn.active { border-color:var(--primary); background:var(--primary); color:white; box-shadow:0 4px 16px rgba(26,60,94,0.25); transform:translateY(-2px); }
  .class-btn.active .section { color:var(--accent); opacity:1; }

  .limit-reached { background:#fff8e1; border:1px solid #ffe082; border-radius:12px; padding:12px 16px; font-size:13px; color:#7a5000; font-weight:600; display:none; align-items:center; gap:8px; margin-bottom:16px; }
  .limit-reached.show { display:flex; }

  .students-card { background:var(--card); border-radius:20px; overflow:hidden; box-shadow:0 2px 20px rgba(26,60,94,0.06); }
  .students-card-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .students-card-header h3 { font-size:15px; font-weight:700; }
  .daily-limit { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); background:var(--bg); padding:6px 14px; border-radius:20px; }
  .limit-dots { display:flex; gap:4px; }
  .limit-dot { width:10px; height:10px; border-radius:50%; background:var(--border); transition:all 0.3s; }
  .limit-dot.used { background:var(--accent); }

  .student-row { padding:12px 20px; border-bottom:1px solid var(--border); transition:background 0.15s; }
  .student-row:last-child { border-bottom:none; }
  .student-row:hover { background:#f8fafc; }
  .student-row.saved { background:#f0fdf4; }
  .student-row.saved-deduct { background:#fff5f5; }

  .student-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .student-num { width:26px; height:26px; background:var(--bg); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--muted); flex-shrink:0; }
  .student-name { flex:1; font-size:15px; font-weight:600; }
  .saved-badge { font-size:12px; font-weight:600; color:var(--success); display:none; }
  .saved-badge.show { display:inline; }
  .saved-badge.deduct { color:var(--danger); }

  .student-btns-row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .btn-col { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .btns-label { font-size:11px; font-weight:700; color:var(--muted); min-width:28px; }
  .btns-label.red { color:#c0392b; }

  .pt-btn { width:38px; height:38px; border:2px solid var(--border); border-radius:10px; background:white; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:14px; font-weight:800; color:var(--muted); transition:all 0.15s; display:flex; align-items:center; justify-content:center; }
  .pt-btn:hover { border-color:var(--accent); color:var(--accent); transform:scale(1.1); }
  .pt-btn.selected { background:var(--primary); border-color:var(--primary); color:white; transform:scale(1.08); }
  .pt-btn:disabled { opacity:0.3; cursor:not-allowed; transform:none; }
  .pt-btn.deduct { color:#c0392b; border-color:#fad4d1; background:#fff8f7; }
  .pt-btn.deduct:hover { border-color:var(--danger); color:var(--danger); background:#fff0ee; }
  .pt-btn.deduct.selected { background:var(--danger); border-color:var(--danger); color:white; }

  .save-bar { position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--border); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; box-shadow:0 -4px 20px rgba(26,60,94,0.08); }
  .save-summary { font-size:13px; color:var(--muted); }
  .save-summary span { color:var(--primary); font-weight:700; }
  .btn-save { padding:12px 28px; background:var(--primary); color:white; border:none; border-radius:12px; font-family:'Tajawal',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:8px; }
  .btn-save:hover { background:#0f2a45; transform:translateY(-1px); }
  .btn-save:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; transform:none; }

  .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state .big-icon { font-size:48px; margin-bottom:12px; }

  .toast { position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-20px); background:#1e4620; color:white; padding:12px 24px; border-radius:12px; font-size:14px; font-weight:600; opacity:0; transition:all 0.3s; z-index:999; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .loading-overlay { position:fixed; inset:0; background:rgba(255,255,255,0.8); display:flex; align-items:center; justify-content:center; z-index:200; display:none; }
  .loading-overlay.show { display:flex; }
  .spinner-big { width:40px; height:40px; border:4px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes pulse-green { 0%{background:#dcfce7} 100%{background:#f0fdf4} }
  @keyframes pulse-red   { 0%{background:#fde8e8} 100%{background:#fff5f5} }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="icon">⭐</div>
    <span>نظام النجوم</span>
  </div>
  <div class="topbar-user">
    <span id="teacherNameDisplay">المعلم</span>
    <button class="btn-logout" onclick="logout()">خروج</button>
  </div>
</div>

<div class="content">
  <div class="section-title">اختر الفصل</div>
  <div class="classes-grid">
    <button class="class-btn" onclick="selectClass(this,'4A','الصف الرابع','أ')"><div class="grade">الرابع</div><div class="section">أ</div></button>
    <button class="class-btn" onclick="selectClass(this,'4B','الصف الرابع','ب')"><div class="grade">الرابع</div><div class="section">ب</div></button>
    <button class="class-btn" onclick="selectClass(this,'5A','الصف الخامس','أ')"><div class="grade">الخامس</div><div class="section">أ</div></button>
    <button class="class-btn" onclick="selectClass(this,'5B','الصف الخامس','ب')"><div class="grade">الخامس</div><div class="section">ب</div></button>
    <button class="class-btn" onclick="selectClass(this,'6A','الصف السادس','أ')"><div class="grade">السادس</div><div class="section">أ</div></button>
    <button class="class-btn" onclick="selectClass(this,'6B','الصف السادس','ب')"><div class="grade">السادس</div><div class="section">ب</div></button>
  </div>

  <div class="limit-reached" id="limitReached">⚠️ وصلت للحد الأقصى اليوم (٣ جلسات)، يمكنك إدخال نقاط غداً</div>

  <div id="emptyState" class="empty-state"><div class="big-icon">👆</div><p>اختر فصلاً لبدء رصد النقاط</p></div>

  <div class="students-card" id="studentsCard" style="display:none;">
    <div class="students-card-header">
      <h3 id="cardTitle"></h3>
      <div class="daily-limit">
        <span>جلسات اليوم:</span>
        <div class="limit-dots"><div class="limit-dot" id="dot1"></div><div class="limit-dot" id="dot2"></div><div class="limit-dot" id="dot3"></div></div>
      </div>
    </div>
    <div id="studentsList"></div>
    <div class="save-bar">
      <div class="save-summary">تم تحديد نقاط لـ <span id="selectedCount">0</span> طالب</div>
      <button class="btn-save" id="saveBtn" onclick="savePoints()" disabled>حفظ النقاط ✓</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner-big"></div></div>

<script type="module">
import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, addDoc, doc, updateDoc, increment, serverTimestamp, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app  = initializeApp({ apiKey:"AIzaSyBvOLYvQ7QH4VOOidQ165F2Ao6_9fBi4g8", authDomain:"anas-96718.firebaseapp.com", projectId:"anas-96718", storageBucket:"anas-96718.firebasestorage.app", messagingSenderId:"459362938160", appId:"1:459362938160:web:5cc9c88bedfc3e95d06cf5" });
const auth = getAuth(app);
const db   = getFirestore(app);

// ====== التحقق من الجلسة ======
const userRaw = sessionStorage.getItem('user');
if (!userRaw) { window.location.href='login.html'; }
const user = JSON.parse(userRaw);
if (user.role !== 'teacher') { window.location.href='login.html'; }
document.getElementById('teacherNameDisplay').textContent = user.name || 'المعلم';

// ====== الحالة ======
let currentClassId   = null;
let currentStudents  = [];
let selPositive      = {};
let selDeduct        = {};
let dailySessions    = 0;
let isLimitReached   = false;

// ====== حساب رقم الأسبوع ======
function getWeekKey() {
  const now=new Date(), year=now.getFullYear();
  const start=new Date(year,0,1);
  const week=Math.ceil(((now-start)/86400000+start.getDay()+1)/7);
  return `${year}-W${String(week).padStart(2,'0')}`;
}

function getTodayKey() {
  const d=new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

// ====== جلب عدد جلسات اليوم ======
async function fetchTodaySessions() {
  const today = getTodayKey();
  const q = query(
    collection(db,'points_log'),
    where('teacherId','==',user.uid),
    where('date','==',today)
  );
  const snap = await getDocs(q);
  // نحسب عدد الجلسات الفريدة (كل batch = جلسة)
  const sessions = new Set(snap.docs.map(d => d.data().sessionId));
  dailySessions = sessions.size;
  updateSessionDots();
  if (dailySessions >= 3) {
    isLimitReached = true;
    document.getElementById('limitReached').classList.add('show');
  }
}

// ====== اختيار الفصل ======
window.selectClass = async (btn, classId, gradeName, section) => {
  document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentClassId = classId;
  selPositive = {}; selDeduct = {};
  await loadStudents(classId, `${gradeName} ${section}`);
};

// ====== جلب طلاب الفصل ======
async function loadStudents(classId, className) {
  showLoading(true);
  try {
    const q = query(collection(db,'students'), where('classId','==',classId));
    const snap = await getDocs(q);
    currentStudents = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderStudents(className);
  } catch(e) {
    showToast('❌ خطأ في جلب بيانات الطلاب');
  } finally {
    showLoading(false);
  }
}

// ====== رسم قائمة الطلاب ======
function renderStudents(className) {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('studentsCard').style.display = 'block';
  document.getElementById('cardTitle').textContent = className;

  const list = document.getElementById('studentsList');
  list.innerHTML = '';

  currentStudents.forEach((student, i) => {
    const row = document.createElement('div');
    row.className = 'student-row';
    row.id = `row-${i}`;
    row.innerHTML = `
      <div class="student-top">
        <div class="student-num">${i+1}</div>
        <div class="student-name">${student.name}</div>
        <div class="saved-badge" id="saved-${i}"></div>
      </div>
      <div class="student-btns-row">
        ${[1,2,3].map(p => `
          <div class="btn-col">
            <button class="pt-btn" id="pos-${i}-${p}" onclick="selectPositive(${i},${p})" ${isLimitReached?'disabled':''} title="+${p}">${p}</button>
            <button class="pt-btn deduct" id="ded-${i}-${p}" onclick="selectDeduct(${i},${p})" ${isLimitReached?'disabled':''} title="-${p}">-${p}</button>
          </div>
        `).join('')}
        ${[4,5].map(p => `
          <div class="btn-col">
            <button class="pt-btn" id="pos-${i}-${p}" onclick="selectPositive(${i},${p})" ${isLimitReached?'disabled':''} title="+${p}">${p}</button>
            <div style="height:38px;width:38px;"></div>
          </div>
        `).join('')}
      </div>
    `;
    list.appendChild(row);
  });

  updateSaveBtn();
}

window.selectPositive = (idx, val) => {
  if (isLimitReached) return;
  selPositive[idx] = (selPositive[idx]===val) ? undefined : val;
  [1,2,3,4,5].forEach(p => { const b=document.getElementById(`pos-${idx}-${p}`); if(b) b.classList.toggle('selected', p===selPositive[idx]); });
  updateSaveBtn();
};

window.selectDeduct = (idx, val) => {
  if (isLimitReached) return;
  selDeduct[idx] = (selDeduct[idx]===val) ? undefined : val;
  [1,2,3].forEach(p => { const b=document.getElementById(`ded-${idx}-${p}`); if(b) b.classList.toggle('selected', p===selDeduct[idx]); });
  updateSaveBtn();
};

function updateSaveBtn() {
  const total = Object.values(selPositive).filter(v=>v!==undefined).length + Object.values(selDeduct).filter(v=>v!==undefined).length;
  document.getElementById('selectedCount').textContent = total;
  document.getElementById('saveBtn').disabled = total===0 || isLimitReached;
}

// ====== حفظ النقاط في Firebase ======
window.savePoints = async () => {
  const total = Object.values(selPositive).filter(v=>v!==undefined).length + Object.values(selDeduct).filter(v=>v!==undefined).length;
  if (total===0) return;

  const btn = document.getElementById('saveBtn');
  btn.disabled=true; btn.textContent='جاري الحفظ...';

  const sessionId = Date.now().toString();
  const today     = getTodayKey();
  const weekKey   = getWeekKey();
  const monthKey  = new Date().toISOString().slice(0,7);

  try {
    const promises = [];

    currentStudents.forEach((student, idx) => {
      const pos = selPositive[idx];
      const ded = selDeduct[idx];

      if (pos !== undefined) {
        // حفظ في السجل
        promises.push(addDoc(collection(db,'points_log'), {
          studentId:   student.id,
          studentName: student.name,
          teacherId:   user.uid,
          teacherName: user.name,
          classId:     currentClassId,
          points:      pos,
          date:        today,
          week:        weekKey,
          month:       monthKey,
          sessionId:   sessionId,
          createdAt:   serverTimestamp()
        }));
        // تحديث نقاط الطالب
        promises.push(updateDoc(doc(db,'students',student.id), {
          weeklyPoints:   increment(pos),
          monthlyPoints:  increment(pos),
          totalPoints:    increment(pos)
        }));
      }

      if (ded !== undefined) {
        promises.push(addDoc(collection(db,'points_log'), {
          studentId:   student.id,
          studentName: student.name,
          teacherId:   user.uid,
          teacherName: user.name,
          classId:     currentClassId,
          points:      -ded,
          date:        today,
          week:        weekKey,
          month:       monthKey,
          sessionId:   sessionId,
          createdAt:   serverTimestamp()
        }));
        promises.push(updateDoc(doc(db,'students',student.id), {
          weeklyPoints:  increment(-ded),
          monthlyPoints: increment(-ded),
          totalPoints:   increment(-ded)
        }));
      }

      // تحديث مظهر الصف
      if (pos!==undefined || ded!==undefined) {
        const badge = document.getElementById(`saved-${idx}`);
        const row   = document.getElementById(`row-${idx}`);
        const parts = [];
        if (pos!==undefined) parts.push(`✓ +${pos}`);
        if (ded!==undefined) parts.push(`✗ -${ded}`);
        badge.textContent = parts.join('  ');
        badge.className = 'saved-badge show' + (ded!==undefined&&pos===undefined?' deduct':'');
        row.classList.add(pos!==undefined?'saved':'saved-deduct');

        setTimeout(() => {
          row.classList.remove('saved','saved-deduct');
          badge.className='saved-badge'; badge.textContent='';
          [1,2,3,4,5].forEach(p=>{const b=document.getElementById(`pos-${idx}-${p}`);if(b)b.classList.remove('selected');});
          [1,2,3].forEach(p=>{const b=document.getElementById(`ded-${idx}-${p}`);if(b)b.classList.remove('selected');});
        }, 2500);
      }
    });

    await Promise.all(promises);

    dailySessions++;
    updateSessionDots();
    selPositive={}; selDeduct={};
    updateSaveBtn();
    btn.textContent='حفظ النقاط ✓';

    if (dailySessions >= 3) {
      isLimitReached = true;
      document.getElementById('limitReached').classList.add('show');
      document.querySelectorAll('.pt-btn').forEach(b=>b.disabled=true);
    }

    showToast('✅ تم حفظ النقاط بنجاح!');
  } catch(e) {
    showToast('❌ حدث خطأ أثناء الحفظ');
    btn.disabled=false;
    btn.textContent='حفظ النقاط ✓';
  }
};

function updateSessionDots() {
  for(let i=1;i<=3;i++) document.getElementById(`dot${i}`).classList.toggle('used',i<=dailySessions);
}

window.logout = async () => {
  await signOut(auth);
  sessionStorage.clear();
  window.location.href='login.html';
};

function showLoading(v) { document.getElementById('loadingOverlay').classList.toggle('show',v); }
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ====== تهيئة ======
fetchTodaySessions();
</script>
</body>
</html>
