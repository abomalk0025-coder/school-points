<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلم - نظام النجوم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3c5e;
    --accent: #f0a500;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #1a2b3c;
    --muted: #7a8fa6;
    --border: #d8e4f0;
    --success: #2ecc71;
    --danger: #e74c3c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  /* ====== الشريط العلوي ====== */
  .topbar {
    background: var(--primary);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(26,60,94,0.2);
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
  }

  .topbar-brand .icon {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .topbar-brand span {
    font-size: 15px;
    font-weight: 700;
  }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
  }

  .avatar {
    width: 34px; height: 34px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .btn-logout {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    padding: 6px 14px;
    border-radius: 8px;
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-logout:hover { background: rgba(255,255,255,0.2); }

  /* ====== المحتوى ====== */
  .content {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* ====== اختيار الفصل ====== */
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .classes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }

  .class-btn {
    padding: 14px 10px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    transition: all 0.2s ease;
    text-align: center;
  }

  .class-btn .grade { font-size: 11px; font-weight: 500; opacity: 0.7; margin-bottom: 2px; }
  .class-btn .section { font-size: 20px; font-weight: 800; color: var(--primary); opacity: 0.4; }

  .class-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(26,60,94,0.1);
  }

  .class-btn.active {
    border-color: var(--primary);
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 16px rgba(26,60,94,0.25);
    transform: translateY(-2px);
  }

  .class-btn.active .section { color: var(--accent); opacity: 1; }

  /* ====== جلسة اليوم ====== */
  .session-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .session-info {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .session-badge {
    background: #e8f5e9;
    color: #2e7d32;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .session-date {
    font-size: 13px;
    color: var(--muted);
  }

  /* حصة اليوم */
  .daily-limit {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    padding: 6px 14px;
    border-radius: 20px;
  }

  .limit-dots {
    display: flex;
    gap: 4px;
  }

  .limit-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--border);
    transition: all 0.3s;
  }

  .limit-dot.used { background: var(--accent); }

  /* ====== قائمة الطلاب ====== */
  .students-card {
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 2px 20px rgba(26,60,94,0.06);
    animation: fadeIn 0.4s ease;
  }

  .students-card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .students-card-header h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .students-count {
    font-size: 13px;
    color: var(--muted);
  }

  /* صف الطالب */
  .student-row {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .student-row:last-child { border-bottom: none; }
  .student-row:hover { background: #f8fafc; }

  .student-row.saved { background: #f0fdf4; animation: pulse-green 0.5s ease; }

  /* السطر الأول: رقم + اسم + شارة */
  .student-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .student-num {
    width: 26px; height: 26px;
    background: var(--bg);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    color: var(--muted); flex-shrink: 0;
  }

  .student-name {
    flex: 1;
    font-size: 15px; font-weight: 600;
    color: var(--text);
  }

  /* شبكة الأزرار: كل عمود = رقم موجب فوق + سالب تحته */
  .student-btns-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .btn-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  /* أزرار النقاط */
  .points-btns { display: flex; gap: 8px; }

  .pt-btn {
    width: 38px; height: 38px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: white;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px; font-weight: 800;
    color: var(--muted);
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
  }

  .pt-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(1.1);
  }

  .pt-btn.selected {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    transform: scale(1.08);
  }

  .pt-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  /* أزرار الخصم */
  .pt-btn.deduct {
    color: #c0392b;
    border-color: #fad4d1;
    background: #fff8f7;
    font-size: 12px;
  }

  .pt-btn.deduct:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: #fff0ee;
    transform: scale(1.1);
  }

  .pt-btn.deduct.selected {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
    transform: scale(1.08);
  }

  /* فاصل بين النقاط والخصم */
  .pts-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
    margin: 0 4px;
    flex-shrink: 0;
  }

  /* لون صف الخصم */
  .student-row.saved-deduct {
    background: #fff5f5;
    animation: pulse-red 0.5s ease;
  }

  @keyframes pulse-red {
    0%   { background: #fde8e8; }
    100% { background: #fff5f5; }
  }

  .saved-badge.deduct { color: var(--danger); }

  /* مؤشر الحفظ */
  .saved-badge {
    font-size: 12px;
    color: var(--success);
    font-weight: 600;
    display: none;
    align-items: center;
    gap: 4px;
  }

  .saved-badge.show { display: flex; }

  /* ====== زر الحفظ ====== */
  .save-bar {
    position: sticky;
    bottom: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 -4px 20px rgba(26,60,94,0.08);
  }

  .save-summary {
    font-size: 13px;
    color: var(--muted);
  }

  .save-summary span {
    color: var(--primary);
    font-weight: 700;
  }

  .btn-save {
    padding: 12px 28px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-save:hover {
    background: #0f2a45;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(26,60,94,0.25);
  }

  .btn-save:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ====== رسالة النجاح ====== */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #1e4620;
    color: white;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ====== حالة فارغة ====== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* ====== حد يومي مكتمل ====== */
  .limit-reached {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    color: #7a5000;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    display: none;
  }

  .limit-reached.show { display: flex; }

  /* ====== أنيميشن ====== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse-green {
    0%   { background: #dcfce7; }
    100% { background: #f0fdf4; }
  }

  /* موبايل */
  @media (max-width: 500px) {
    .classes-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pt-btn { width: 32px; height: 32px; font-size: 13px; }
    .student-name { font-size: 14px; }
    .points-btns { gap: 4px; }
  }
</style>
</head>
<body>

<!-- الشريط العلوي -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="icon">⭐</div>
    <span>نظام النجوم</span>
  </div>
  <div class="topbar-user">
    <div class="avatar">👨‍🏫</div>
    <span>أ. محمد العتيبي</span>
    <button class="btn-logout" onclick="window.location='login.html'">خروج</button>
  </div>
</div>

<!-- المحتوى -->
<div class="content">

  <!-- اختيار الفصل -->
  <div class="section-title">اختر الفصل</div>
  <div class="classes-grid">
    <button class="class-btn" onclick="selectClass(this, '4أ', 'الصف الرابع')">
      <div class="grade">الرابع</div>
      <div class="section">أ</div>
    </button>
    <button class="class-btn" onclick="selectClass(this, '4ب', 'الصف الرابع')">
      <div class="grade">الرابع</div>
      <div class="section">ب</div>
    </button>
    <button class="class-btn" onclick="selectClass(this, '5أ', 'الصف الخامس')">
      <div class="grade">الخامس</div>
      <div class="section">أ</div>
    </button>
    <button class="class-btn" onclick="selectClass(this, '5ب', 'الصف الخامس')">
      <div class="grade">الخامس</div>
      <div class="section">ب</div>
    </button>
    <button class="class-btn" onclick="selectClass(this, '6أ', 'الصف السادس')">
      <div class="grade">السادس</div>
      <div class="section">أ</div>
    </button>
    <button class="class-btn" onclick="selectClass(this, '6ب', 'الصف السادس')">
      <div class="grade">السادس</div>
      <div class="section">ب</div>
    </button>
  </div>

  <!-- تنبيه الحد اليومي -->
  <div class="limit-reached" id="limitReached">
    ⚠️ وصلت للحد الأقصى اليوم (٣ جلسات)، يمكنك إدخال نقاط غداً
  </div>

  <!-- قائمة الطلاب -->
  <div id="studentsSection">

    <!-- حالة فارغة -->
    <div class="empty-state" id="emptyState">
      <div class="big-icon">👆</div>
      <p>اختر فصلاً من القائمة أعلاه لبدء رصد النقاط</p>
    </div>

    <!-- بطاقة الطلاب -->
    <div class="students-card" id="studentsCard" style="display:none;">

      <div class="students-card-header">
        <h3 id="cardTitle">الصف الرابع أ</h3>
        <div class="session-info">
          <div class="daily-limit">
            <span>جلسات اليوم:</span>
            <div class="limit-dots">
              <div class="limit-dot" id="dot1"></div>
              <div class="limit-dot" id="dot2"></div>
              <div class="limit-dot" id="dot3"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="studentsList"></div>

      <!-- شريط الحفظ -->
      <div class="save-bar">
        <div class="save-summary">
          تم تحديد نقاط لـ <span id="selectedCount">0</span> طالب
        </div>
        <button class="btn-save" id="saveBtn" onclick="savePoints()" disabled>
          حفظ النقاط ✓
        </button>
      </div>

    </div>
  </div>

</div>

<!-- رسالة النجاح -->
<div class="toast" id="toast">✅ تم حفظ النقاط بنجاح!</div>

<script>
// ====== البيانات التجريبية ======
const classesData = {
  '4أ': ['أحمد محمد العتيبي','سلطان عبدالله الغامدي','خالد سعد الزهراني','فهد علي القحطاني','عمر يوسف الدوسري','ماجد ناصر الشمري'],
  '4ب': ['محمد سعيد البلوي','عبدالرحمن طارق','بدر فيصل الحربي','تركي وليد المطيري','راشد حمد العنزي','سعود جابر الرشيدي'],
  '5أ': ['يوسف إبراهيم السبيعي','ابراهيم سالم الرويلي','حمود عادل المالكي','وليد حسين الجهني','صالح مشعل الثبيتي','منصور نواف العمري'],
  '5ب': ['نواف سليمان الشهري','مساعد خالد العجمي','فيصل سطام الجهني','ريان عمر المقرن','عبدالعزيز سلطان','حازم محمد البقمي'],
  '6أ': ['عبدالله ماجد المزروع','أنس طارق الغامدي','حمزة فهد المطيري','زياد يوسف الزهراني','بكر سعد العتيبي','سامي خالد الأحمدي'],
  '6ب': ['فارس محمد الدوسري','حسن علي الشريف','كريم عبدالله الحازمي','أسامة ناصر الحربي','لؤي سعيد القرني','أيمن وليد الرشيدي'],
};

// حالة التطبيق
let currentClass  = null;
let selPositive   = {};   // idx -> 1..5  (مستقل)
let selDeduct     = {};   // idx -> 1..3  (مستقل)
let dailySessions = 0;
let isLimitReached = false;

// ====== اختيار الفصل ======
function selectClass(btn, classId, gradeName) {
  document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentClass = classId;
  selPositive = {}; selDeduct = {};
  renderStudents(classId, gradeName);
}

// ====== رسم قائمة الطلاب ======
function renderStudents(classId, gradeName) {
  const students = classesData[classId];
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('studentsCard').style.display = 'block';
  document.getElementById('cardTitle').textContent = `${gradeName} - ${classId}`;

  const list = document.getElementById('studentsList');
  list.innerHTML = '';

  students.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'student-row';
    row.id = `row-${i}`;
    row.innerHTML = `
      <div class="student-top">
        <div class="student-num">${i + 1}</div>
        <div class="student-name">${name}</div>
        <div class="saved-badge" id="saved-${i}"></div>
      </div>
      <div class="student-btns-row">
        ${[1,2,3].map(p => `
          <div class="btn-col">
            <button class="pt-btn" id="pos-${i}-${p}" onclick="selectPositive(${i},${p})"
              ${isLimitReached?'disabled':''} title="+${p}">${p}</button>
            <button class="pt-btn deduct" id="ded-${i}-${p}" onclick="selectDeduct(${i},${p})"
              ${isLimitReached?'disabled':''} title="-${p}">-${p}</button>
          </div>
        `).join('')}
        ${[4,5].map(p => `
          <div class="btn-col">
            <button class="pt-btn" id="pos-${i}-${p}" onclick="selectPositive(${i},${p})"
              ${isLimitReached?'disabled':''} title="+${p}">${p}</button>
            <div style="height:38px;width:38px;"></div>
          </div>
        `).join('')}
      </div>
    `;
    list.appendChild(row);
  });

  updateSaveBtn();
}

// ====== اختيار نقطة موجبة (مستقلة تماماً عن الخصم) ======
function selectPositive(idx, val) {
  if (isLimitReached) return;
  // ضغطة ثانية = إلغاء
  selPositive[idx] = (selPositive[idx] === val) ? undefined : val;
  [1,2,3,4,5].forEach(p => {
    const b = document.getElementById(`pos-${idx}-${p}`);
    if (b) b.classList.toggle('selected', p === selPositive[idx]);
  });
  updateSaveBtn();
}

// ====== اختيار خصم (مستقل تماماً عن الموجب) ======
function selectDeduct(idx, val) {
  if (isLimitReached) return;
  // ضغطة ثانية = إلغاء
  selDeduct[idx] = (selDeduct[idx] === val) ? undefined : val;
  [1,2,3].forEach(p => {
    const b = document.getElementById(`ded-${idx}-${p}`);
    if (b) b.classList.toggle('selected', p === selDeduct[idx]);
  });
  updateSaveBtn();
}

// ====== تحديث زر الحفظ ======
function updateSaveBtn() {
  const posCount = Object.values(selPositive).filter(v => v !== undefined).length;
  const dedCount = Object.values(selDeduct).filter(v => v !== undefined).length;
  document.getElementById('selectedCount').textContent = posCount + dedCount;
  document.getElementById('saveBtn').disabled = (posCount + dedCount === 0) || isLimitReached;
}

// ====== حفظ النقاط ======
function savePoints() {
  const posCount = Object.values(selPositive).filter(v => v !== undefined).length;
  const dedCount = Object.values(selDeduct).filter(v => v !== undefined).length;
  if (posCount + dedCount === 0) return;

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الحفظ...';

  setTimeout(() => {
    const students = classesData[currentClass];

    students.forEach((_, idx) => {
      const pos = selPositive[idx];
      const ded = selDeduct[idx];
      if (pos === undefined && ded === undefined) return;

      const badge = document.getElementById(`saved-${idx}`);
      const row   = document.getElementById(`row-${idx}`);

      // نص الشارة يجمع الموجب والخصم معاً
      const parts = [];
      if (pos !== undefined) parts.push(`✓ +${pos}`);
      if (ded !== undefined) parts.push(`✗ -${ded}`);
      badge.textContent = parts.join('  ');
      badge.className = 'saved-badge show' + (ded !== undefined && pos === undefined ? ' deduct' : '');

      // لون الصف مؤقت ثم يُعاد ضبطه
      row.classList.add(pos !== undefined ? 'saved' : 'saved-deduct');

      setTimeout(() => {
        row.classList.remove('saved', 'saved-deduct');
        badge.className  = 'saved-badge';
        badge.textContent = '';
        // إلغاء تحديد الأزرار فقط (لا تعطيل)
        [1,2,3,4,5].forEach(p => { const b=document.getElementById(`pos-${idx}-${p}`); if(b) b.classList.remove('selected'); });
        [1,2,3].forEach(p => { const b=document.getElementById(`ded-${idx}-${p}`); if(b) b.classList.remove('selected'); });
      }, 2500);
    });

    // تحديث عداد الجلسات
    dailySessions++;
    updateSessionDots();

    // مسح التحديدات
    selPositive = {}; selDeduct = {};
    updateSaveBtn();
    btn.textContent = 'حفظ النقاط ✓';

    // تحقق من الحد اليومي (٣ جلسات)
    if (dailySessions >= 3) {
      isLimitReached = true;
      document.getElementById('limitReached').classList.add('show');
      document.querySelectorAll('.pt-btn').forEach(b => b.disabled = true);
    }

    showToast('✅ تم حفظ النقاط بنجاح!');
  }, 900);
}

// ====== تحديث نقاط الجلسات ======
function updateSessionDots() {
  for (let i = 1; i <= 3; i++) {
    document.getElementById(`dot${i}`).classList.toggle('used', i <= dailySessions);
  }
}

// ====== رسالة النجاح ======
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
